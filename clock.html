<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Glassmorphism Digital Clock</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'DM Sans', sans-serif;
      overflow: hidden;
      position: relative;
      background: #0a0a1a;
    }

    /* ── ANIMATED GRADIENT BACKGROUND ── */
    .bg {
      position: fixed; inset: 0;
      background: linear-gradient(125deg,
        #0a0a1a 0%,
        #0d0b2e 30%,
        #120a2e 60%,
        #0a1020 100%
      );
      z-index: 0;
    }

    /* Floating orbs */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.35;
      animation: orb-drift linear infinite;
      z-index: 0;
    }

    .orb-1 {
      width: 500px; height: 500px;
      background: radial-gradient(circle, #7c3aed, transparent 70%);
      top: -150px; left: -100px;
      animation-duration: 18s;
      animation-delay: 0s;
    }

    .orb-2 {
      width: 400px; height: 400px;
      background: radial-gradient(circle, #1d4ed8, transparent 70%);
      bottom: -100px; right: -80px;
      animation-duration: 22s;
      animation-delay: -8s;
    }

    .orb-3 {
      width: 300px; height: 300px;
      background: radial-gradient(circle, #be185d, transparent 70%);
      top: 50%; left: 60%;
      animation-duration: 15s;
      animation-delay: -4s;
    }

    @keyframes orb-drift {
      0%   { transform: translate(0, 0) scale(1); }
      33%  { transform: translate(40px, -30px) scale(1.08); }
      66%  { transform: translate(-20px, 40px) scale(0.95); }
      100% { transform: translate(0, 0) scale(1); }
    }

    /* ── BACK LINK ── */
    .back {
      position: fixed; top: 20px; left: 24px;
      font-size: 12px; color: rgba(255,255,255,0.3);
      text-decoration: none; font-family: 'DM Sans', monospace;
      letter-spacing: 0.05em;
      transition: color 0.2s; z-index: 100;
    }
    .back:hover { color: #a78bfa; }

    /* ── MAIN WRAPPER ── */
    .wrapper {
      position: relative; z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
    }

    /* date label above */
    .date-label {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.82rem;
      font-weight: 500;
      color: rgba(255,255,255,0.4);
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    /* ── GLASS CLOCK CARD ── */
    .clock-card {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 28px;
      padding: 48px 52px 44px;
      box-shadow:
        0 8px 32px rgba(0,0,0,0.4),
        0 0 0 1px rgba(255,255,255,0.04) inset,
        inset 0 1px 0 rgba(255,255,255,0.12);
      position: relative;
      overflow: hidden;
    }

    /* sheen highlight at top */
    .clock-card::before {
      content: '';
      position: absolute;
      top: 0; left: 10%; right: 10%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
    }

    /* inner glow */
    .clock-card::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(124,58,237,0.12), transparent 60%);
      pointer-events: none;
    }

    /* ── TIME DISPLAY ── */
    .time-row {
      display: flex;
      align-items: center;
      gap: 0;
      position: relative;
      z-index: 1;
    }

    .time-segment {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .digits {
      font-family: 'Orbitron', monospace;
      font-size: clamp(52px, 10vw, 88px);
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(180deg, #ffffff 0%, rgba(167,139,250,0.9) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.02em;
      text-shadow: none;
      /* glow via filter */
      filter: drop-shadow(0 0 20px rgba(167,139,250,0.4));
      min-width: 2ch;
      text-align: center;
      transition: filter 0.3s ease;
    }

    .digits.tick {
      filter: drop-shadow(0 0 30px rgba(167,139,250,0.7));
    }

    .seg-label {
      font-size: 0.62rem;
      font-weight: 500;
      color: rgba(255,255,255,0.25);
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    /* colon separator */
    .colon {
      font-family: 'Orbitron', monospace;
      font-size: clamp(44px, 8vw, 72px);
      font-weight: 900;
      color: rgba(167,139,250,0.5);
      line-height: 1;
      margin: 0 6px;
      padding-bottom: 18px; /* align with digits */
      animation: colon-blink 1s step-end infinite;
      user-select: none;
    }

    @keyframes colon-blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.15; }
    }

    /* ── AM/PM + TIMEZONE ── */
    .meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 20px;
      padding-top: 18px;
      border-top: 1px solid rgba(255,255,255,0.07);
      position: relative; z-index: 1;
      gap: 24px;
    }

    .ampm {
      font-family: 'Orbitron', monospace;
      font-size: 1rem;
      font-weight: 700;
      color: rgba(167,139,250,0.7);
      letter-spacing: 0.08em;
    }

    .timezone {
      font-size: 0.75rem;
      color: rgba(255,255,255,0.25);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-weight: 500;
    }

    /* seconds progress bar */
    .seconds-bar-wrap {
      flex: 1;
      height: 3px;
      background: rgba(255,255,255,0.07);
      border-radius: 2px;
      overflow: hidden;
    }

    .seconds-bar {
      height: 100%;
      background: linear-gradient(90deg, #7c3aed, #a78bfa);
      border-radius: 2px;
      transition: width 0.95s linear;
      box-shadow: 0 0 8px rgba(167,139,250,0.6);
    }

    /* ── WORLD CLOCKS STRIP ── */
    .world-clocks {
      display: flex;
      gap: 12px;
    }

    .world-card {
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 14px;
      padding: 14px 18px;
      text-align: center;
      min-width: 90px;
      transition: background 0.25s, border-color 0.25s;
    }

    .world-card:hover {
      background: rgba(255,255,255,0.08);
      border-color: rgba(167,139,250,0.3);
    }

    .world-city {
      font-size: 0.67rem;
      color: rgba(255,255,255,0.3);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .world-time {
      font-family: 'Orbitron', monospace;
      font-size: 0.95rem;
      font-weight: 700;
      color: rgba(255,255,255,0.75);
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>

<div class="bg"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>

<a class="back" href="index.html">← back</a>

<div class="wrapper">

  <div class="date-label" id="date-label"></div>

  <div class="clock-card">
    <div class="time-row">
      <div class="time-segment">
        <div class="digits" id="hours"></div>
        <div class="seg-label">hours</div>
      </div>
      <div class="colon">:</div>
      <div class="time-segment">
        <div class="digits" id="minutes"></div>
        <div class="seg-label">min</div>
      </div>
      <div class="colon">:</div>
      <div class="time-segment">
        <div class="digits" id="seconds"></div>
        <div class="seg-label">sec</div>
      </div>
    </div>

    <div class="meta-row">
      <div class="ampm" id="ampm"></div>
      <div class="seconds-bar-wrap">
        <div class="seconds-bar" id="seconds-bar"></div>
      </div>
      <div class="timezone" id="timezone"></div>
    </div>
  </div>

  <div class="world-clocks" id="world-clocks"></div>

</div>

<script>
  const CITIES = [
    { label: 'New York',  tz: 'America/New_York' },
    { label: 'London',    tz: 'Europe/London'     },
    { label: 'Dubai',     tz: 'Asia/Dubai'        },
    { label: 'Tokyo',     tz: 'Asia/Tokyo'        },
    { label: 'Sydney',    tz: 'Australia/Sydney'  },
  ];

  const pad = n => String(n).padStart(2, '0');

  // Build world clock cards
  const worldEl = document.getElementById('world-clocks');
  CITIES.forEach(c => {
    const div = document.createElement('div');
    div.className = 'world-card';
    div.innerHTML = `<div class="world-city">${c.label}</div><div class="world-time" id="wt-${c.label.replace(' ','')}" ></div>`;
    worldEl.appendChild(div);
  });

  // Date label
  const DAYS   = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  let lastSec = -1;

  function tick() {
    const now = new Date();
    const h24 = now.getHours();
    const m   = now.getMinutes();
    const s   = now.getSeconds();
    const h12 = h24 % 12 || 12;
    const ampm = h24 < 12 ? 'AM' : 'PM';

    document.getElementById('hours').textContent   = pad(h12);
    document.getElementById('minutes').textContent = pad(m);
    document.getElementById('seconds').textContent = pad(s);
    document.getElementById('ampm').textContent    = ampm;
    document.getElementById('seconds-bar').style.width = ((s / 59) * 100) + '%';

    // date
    document.getElementById('date-label').textContent =
      `${DAYS[now.getDay()]}, ${MONTHS[now.getMonth()]} ${now.getDate()}, ${now.getFullYear()}`;

    // timezone
    try {
      const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
      document.getElementById('timezone').textContent = tz.replace('_', ' ');
    } catch(_) {}

    // tick glow flash on second change
    if (s !== lastSec) {
      lastSec = s;
      const secEl = document.getElementById('seconds');
      secEl.classList.add('tick');
      setTimeout(() => secEl.classList.remove('tick'), 200);
    }

    // world clocks
    CITIES.forEach(c => {
      const el = document.getElementById('wt-' + c.label.replace(' ',''));
      if (!el) return;
      const t = new Date().toLocaleTimeString('en-US', {
        timeZone: c.tz, hour: '2-digit', minute: '2-digit', hour12: true
      });
      el.textContent = t;
    });
  }

  tick();
  setInterval(tick, 1000);
</script>

</body>
</html>
