<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Toggle Switches & Star Rating</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #07070f;
      font-family: 'DM Sans', sans-serif;
      color: #e2e8f0;
      padding: 60px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 48px;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background: radial-gradient(ellipse 60% 50% at 50% 30%, rgba(124,58,237,0.1) 0%, transparent 70%);
      pointer-events: none;
    }

    .back {
      position: fixed; top: 20px; left: 24px;
      font-size: 12px; color: #475569;
      text-decoration: none; font-family: 'JetBrains Mono', monospace;
      transition: color 0.2s; z-index: 10;
    }
    .back:hover { color: #a78bfa; }

    .section {
      background: #0f0e1a;
      border: 1px solid rgba(124,58,237,0.18);
      border-radius: 18px;
      padding: 36px 40px;
      width: 100%;
      max-width: 560px;
      position: relative;
    }

    .section h2 {
      font-size: 0.72rem;
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #7c3aed;
      margin-bottom: 28px;
    }

    /* ════════════════════════════
       TOGGLE SWITCHES
    ════════════════════════════ */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .toggle-row:last-child { border-bottom: none; }

    .toggle-label {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .toggle-label span:first-child {
      font-size: 0.9rem;
      font-weight: 600;
      color: #e2e8f0;
    }

    .toggle-label span:last-child {
      font-size: 0.75rem;
      color: #64748b;
    }

    /* Base toggle */
    .toggle {
      position: relative;
      display: inline-block;
      width: 48px;
      height: 26px;
      flex-shrink: 0;
    }

    .toggle input { opacity: 0; width: 0; height: 0; }

    .slider {
      position: absolute; inset: 0;
      border-radius: 13px;
      cursor: pointer;
      transition: background 0.3s ease, box-shadow 0.3s ease;
    }

    .slider::before {
      content: '';
      position: absolute;
      width: 20px; height: 20px;
      left: 3px; top: 3px;
      border-radius: 50%;
      background: #fff;
      transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1), background 0.3s ease;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }

    input:checked + .slider::before { transform: translateX(22px); }

    /* Variant 1 — Purple (default) */
    .slider.purple { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.1); }
    input:checked + .slider.purple {
      background: linear-gradient(135deg, #7c3aed, #5b21b6);
      border-color: transparent;
      box-shadow: 0 0 16px rgba(124,58,237,0.45);
    }

    /* Variant 2 — Teal */
    .slider.teal { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.1); }
    input:checked + .slider.teal {
      background: linear-gradient(135deg, #14b8a6, #0d9488);
      border-color: transparent;
      box-shadow: 0 0 16px rgba(20,184,166,0.45);
    }

    /* Variant 3 — Amber */
    .slider.amber { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.1); }
    input:checked + .slider.amber {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      border-color: transparent;
      box-shadow: 0 0 16px rgba(245,158,11,0.45);
    }

    /* Variant 4 — Wide pill with icon hint */
    .toggle.wide { width: 72px; height: 32px; }
    .toggle.wide .slider::before { width: 26px; height: 26px; }
    input:checked + .slider.wide-pill { transform: translateX(0); }
    .slider.wide-pill { background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.1); }
    .slider.wide-pill::after {
      content: 'OFF';
      position: absolute;
      right: 8px; top: 50%;
      transform: translateY(-50%);
      font-size: 9px;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      color: #475569;
      letter-spacing: 0.05em;
      transition: opacity 0.3s;
    }
    input:checked + .slider.wide-pill {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      border-color: transparent;
      box-shadow: 0 0 16px rgba(99,102,241,0.45);
    }
    input:checked + .slider.wide-pill::after {
      content: 'ON';
      right: auto; left: 8px;
      color: rgba(255,255,255,0.8);
    }
    .toggle.wide input:checked + .slider::before { transform: translateX(40px); }

    /* ════════════════════════════
       STAR RATING
    ════════════════════════════ */
    .stars-wrapper {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .rating-group { display: flex; flex-direction: column; gap: 8px; }

    .rating-group .label {
      font-size: 0.8rem;
      color: #64748b;
      font-weight: 600;
    }

    /* CSS-only star rating — reverse order trick */
    .stars {
      display: flex;
      flex-direction: row-reverse;
      justify-content: flex-end;
      gap: 4px;
    }

    .stars input { display: none; }

    .stars label {
      font-size: 28px;
      color: #1e1e2e;
      cursor: pointer;
      transition: color 0.15s ease, transform 0.2s cubic-bezier(0.34,1.56,0.64,1), text-shadow 0.2s ease;
      filter: grayscale(1);
    }

    /* hover — highlight hovered + all to the right (which are to the left in DOM due to flex-direction: row-reverse) */
    .stars label:hover,
    .stars label:hover ~ label {
      color: #f59e0b;
      filter: none;
      text-shadow: 0 0 12px rgba(245,158,11,0.6);
      transform: scale(1.2);
    }

    /* checked state */
    .stars input:checked ~ label {
      color: #f59e0b;
      filter: none;
      text-shadow: 0 0 10px rgba(245,158,11,0.5);
    }

    /* purple variant */
    .stars.purple label:hover,
    .stars.purple label:hover ~ label,
    .stars.purple input:checked ~ label {
      color: #a78bfa;
      text-shadow: 0 0 12px rgba(167,139,250,0.6);
    }

    /* heart variant */
    .stars.hearts label::before { content: '♡'; }
    .stars.hearts label { font-size: 26px; }
    .stars.hearts label:hover,
    .stars.hearts label:hover ~ label,
    .stars.hearts input:checked ~ label {
      color: #f43f5e;
      text-shadow: 0 0 12px rgba(244,63,94,0.6);
    }
    .stars.hearts label { color: #1e1e2e; filter: none; }
  </style>
</head>
<body>

<a class="back" href="index.html">← back</a>

<!-- TOGGLE SWITCHES -->
<div class="section">
  <h2>// toggle switches</h2>

  <div class="toggle-row">
    <div class="toggle-label">
      <span>Dark Mode</span>
      <span>Switch between light and dark</span>
    </div>
    <label class="toggle">
      <input type="checkbox" checked/>
      <span class="slider purple"></span>
    </label>
  </div>

  <div class="toggle-row">
    <div class="toggle-label">
      <span>Notifications</span>
      <span>Push alerts for new activity</span>
    </div>
    <label class="toggle">
      <input type="checkbox"/>
      <span class="slider teal"></span>
    </label>
  </div>

  <div class="toggle-row">
    <div class="toggle-label">
      <span>Auto-save</span>
      <span>Save drafts automatically</span>
    </div>
    <label class="toggle">
      <input type="checkbox" checked/>
      <span class="slider amber"></span>
    </label>
  </div>

  <div class="toggle-row">
    <div class="toggle-label">
      <span>Beta Features</span>
      <span>Access experimental options</span>
    </div>
    <label class="toggle wide">
      <input type="checkbox"/>
      <span class="slider wide-pill"></span>
    </label>
  </div>
</div>

<!-- STAR RATING -->
<div class="section">
  <h2>// star rating</h2>
  <div class="stars-wrapper">

    <div class="rating-group">
      <div class="label">Gold stars (classic)</div>
      <div class="stars">
        <input type="radio" name="r1" id="s1-5"/><label for="s1-5">★</label>
        <input type="radio" name="r1" id="s1-4"/><label for="s1-4">★</label>
        <input type="radio" name="r1" id="s1-3" checked/><label for="s1-3">★</label>
        <input type="radio" name="r1" id="s1-2"/><label for="s1-2">★</label>
        <input type="radio" name="r1" id="s1-1"/><label for="s1-1">★</label>
      </div>
    </div>

    <div class="rating-group">
      <div class="label">Purple stars (branded)</div>
      <div class="stars purple">
        <input type="radio" name="r2" id="s2-5"/><label for="s2-5">★</label>
        <input type="radio" name="r2" id="s2-4" checked/><label for="s2-4">★</label>
        <input type="radio" name="r2" id="s2-3"/><label for="s2-3">★</label>
        <input type="radio" name="r2" id="s2-2"/><label for="s2-2">★</label>
        <input type="radio" name="r2" id="s2-1"/><label for="s2-1">★</label>
      </div>
    </div>

    <div class="rating-group">
      <div class="label">Heart rating</div>
      <div class="stars hearts">
        <input type="radio" name="r3" id="s3-5"/><label for="s3-5"></label>
        <input type="radio" name="r3" id="s3-4"/><label for="s3-4"></label>
        <input type="radio" name="r3" id="s3-3"/><label for="s3-3"></label>
        <input type="radio" name="r3" id="s3-2" checked/><label for="s3-2"></label>
        <input type="radio" name="r3" id="s3-1"/><label for="s3-1"></label>
      </div>
    </div>

  </div>
</div>

</body>
</html>
