<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CSS Loading Spinners</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #07070f;
      font-family: 'DM Sans', sans-serif;
      color: #e2e8f0;
      padding: 60px 24px;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background: radial-gradient(ellipse 60% 40% at 50% 30%, rgba(124,58,237,0.09) 0%, transparent 70%);
      pointer-events: none;
    }

    .back {
      position: fixed; top: 20px; left: 24px;
      font-size: 12px; color: #475569;
      text-decoration: none; font-family: 'JetBrains Mono', monospace;
      transition: color 0.2s; z-index: 10;
    }
    .back:hover { color: #a78bfa; }

    h1 {
      text-align: center;
      font-size: 0.72rem;
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #7c3aed;
      margin-bottom: 48px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
      max-width: 900px;
      margin: 0 auto;
    }

    .card {
      background: #0f0e1a;
      border: 1px solid rgba(124,58,237,0.16);
      border-radius: 16px;
      padding: 36px 20px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      transition: border-color 0.25s, transform 0.25s;
    }

    .card:hover {
      border-color: rgba(124,58,237,0.45);
      transform: translateY(-3px);
    }

    .card-label {
      font-size: 0.75rem;
      font-family: 'JetBrains Mono', monospace;
      color: #64748b;
      letter-spacing: 0.06em;
    }

    /* ════════════ 1. Ring ════════════ */
    .spin-ring {
      width: 48px; height: 48px;
      border-radius: 50%;
      border: 3px solid rgba(124,58,237,0.15);
      border-top-color: #7c3aed;
      animation: spin 0.8s linear infinite;
    }

    /* ════════════ 2. Dual Ring ════════════ */
    .spin-dual {
      width: 48px; height: 48px;
      border-radius: 50%;
      border: 3px solid rgba(167,139,250,0.2);
      border-top-color: #a78bfa;
      border-bottom-color: #7c3aed;
      animation: spin 1s linear infinite;
    }

    /* ════════════ 3. Dots ════════════ */
    .spin-dots {
      display: flex;
      gap: 7px;
      align-items: center;
    }

    .spin-dots span {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #7c3aed;
      animation: bounce-dot 1.2s ease-in-out infinite;
    }

    .spin-dots span:nth-child(1) { animation-delay: 0s;    background: #a78bfa; }
    .spin-dots span:nth-child(2) { animation-delay: 0.2s;  background: #7c3aed; }
    .spin-dots span:nth-child(3) { animation-delay: 0.4s;  background: #5b21b6; }

    @keyframes bounce-dot {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40%            { transform: scale(1);   opacity: 1; }
    }

    /* ════════════ 4. Bars ════════════ */
    .spin-bars {
      display: flex;
      gap: 5px;
      align-items: flex-end;
      height: 40px;
    }

    .spin-bars span {
      width: 6px;
      border-radius: 3px;
      background: linear-gradient(to top, #5b21b6, #a78bfa);
      animation: bar-grow 1s ease-in-out infinite;
    }

    .spin-bars span:nth-child(1) { animation-delay: 0s;    height: 20px; }
    .spin-bars span:nth-child(2) { animation-delay: 0.15s; height: 32px; }
    .spin-bars span:nth-child(3) { animation-delay: 0.3s;  height: 40px; }
    .spin-bars span:nth-child(4) { animation-delay: 0.15s; height: 32px; }
    .spin-bars span:nth-child(5) { animation-delay: 0s;    height: 20px; }

    @keyframes bar-grow {
      0%, 100% { transform: scaleY(0.4); opacity: 0.5; }
      50%       { transform: scaleY(1);   opacity: 1; }
    }

    /* ════════════ 5. Pulse ════════════ */
    .spin-pulse {
      width: 46px; height: 46px;
      border-radius: 50%;
      background: rgba(124,58,237,0.3);
      animation: pulse-scale 1.2s ease-out infinite;
      position: relative;
    }

    .spin-pulse::after {
      content: '';
      position: absolute; inset: 10px;
      border-radius: 50%;
      background: #7c3aed;
    }

    @keyframes pulse-scale {
      0%   { transform: scale(0.85); opacity: 0.7; }
      60%  { transform: scale(1.2);  opacity: 0.2; }
      100% { transform: scale(0.85); opacity: 0.7; }
    }

    /* ════════════ 6. Orbit ════════════ */
    .spin-orbit {
      width: 48px; height: 48px;
      position: relative;
      animation: spin 2s linear infinite;
    }

    .spin-orbit::before, .spin-orbit::after {
      content: '';
      position: absolute;
      border-radius: 50%;
    }

    .spin-orbit::before {
      width: 12px; height: 12px;
      background: #a78bfa;
      top: 0; left: 50%; transform: translateX(-50%);
      box-shadow: 0 0 10px #a78bfa;
    }

    .spin-orbit::after {
      width: 8px; height: 8px;
      background: #7c3aed;
      bottom: 4px; right: 4px;
      box-shadow: 0 0 8px #7c3aed;
    }

    /* ════════════ 7. Square Spin ════════════ */
    .spin-square {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, #7c3aed, #a78bfa);
      border-radius: 6px;
      animation: square-spin 1.2s ease-in-out infinite;
    }

    @keyframes square-spin {
      0%   { transform: rotate(0deg)   scale(1); }
      50%  { transform: rotate(180deg) scale(0.7); border-radius: 50%; }
      100% { transform: rotate(360deg) scale(1); }
    }

    /* ════════════ 8. Wave Dots ════════════ */
    .spin-wave {
      display: flex;
      gap: 5px;
      align-items: center;
    }

    .spin-wave span {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #7c3aed;
      animation: wave-dot 1.4s ease-in-out infinite;
    }

    .spin-wave span:nth-child(1) { animation-delay: 0s;    }
    .spin-wave span:nth-child(2) { animation-delay: 0.1s;  }
    .spin-wave span:nth-child(3) { animation-delay: 0.2s;  }
    .spin-wave span:nth-child(4) { animation-delay: 0.3s;  }
    .spin-wave span:nth-child(5) { animation-delay: 0.4s;  }

    @keyframes wave-dot {
      0%, 60%, 100% { transform: translateY(0);    background: rgba(124,58,237,0.4); }
      30%            { transform: translateY(-14px); background: #a78bfa; }
    }

    /* shared spin keyframe */
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

<a class="back" href="index.html">← back</a>

<h1>// css loading spinners</h1>

<div class="grid">
  <div class="card">
    <div class="spin-ring"></div>
    <span class="card-label">ring</span>
  </div>
  <div class="card">
    <div class="spin-dual"></div>
    <span class="card-label">dual ring</span>
  </div>
  <div class="card">
    <div class="spin-dots">
      <span></span><span></span><span></span>
    </div>
    <span class="card-label">dots</span>
  </div>
  <div class="card">
    <div class="spin-bars">
      <span></span><span></span><span></span><span></span><span></span>
    </div>
    <span class="card-label">bars</span>
  </div>
  <div class="card">
    <div class="spin-pulse"></div>
    <span class="card-label">pulse</span>
  </div>
  <div class="card">
    <div class="spin-orbit"></div>
    <span class="card-label">orbit</span>
  </div>
  <div class="card">
    <div class="spin-square"></div>
    <span class="card-label">morph square</span>
  </div>
  <div class="card">
    <div class="spin-wave">
      <span></span><span></span><span></span><span></span><span></span>
    </div>
    <span class="card-label">wave</span>
  </div>
</div>

</body>
</html>
